# fly.toml app configuration file generated for split-bill-bot on 2026-09-14T16:43:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'split-bill-bot'
primary_region = 'ams'

[build]

[deploy]
  strategy = 'immediate'

[env]
  DATABASE_PATH = '/app/data/splitcheck.db'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
