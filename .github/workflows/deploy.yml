name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the current one instead of racing it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # picks the version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    name: Deploy to Fly.io
    needs: check
    runs-on: ubuntu-latest
    # Put "[skip deploy]" or "[skip]" in the commit message for changes that don't need to go
    # live (docs, CI config, tests) — checks still run, only the Fly deploy is skipped.
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip deploy]') &&
          !contains(github.event.head_commit.message, '[skip]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
